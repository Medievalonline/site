<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171009">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <title>Medieval Online RP Thailand</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap');
    :root{--bg:#171009;--side:#21170d;--edge:#745329;--gold:#e2bd6b;--text:#f0dfbc;--muted:#bd9c62}
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:'Noto Serif Thai',serif;background:var(--bg);color:var(--text);overflow:hidden}
    .app{height:100dvh;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr)}
    aside{background:linear-gradient(180deg,#2b1d0f,#171009);border-right:1px solid var(--edge);overflow-y:auto;padding:18px 9px 24px}
    .brand{font-family:Cinzel,'Noto Serif Thai',serif;color:var(--gold);font-weight:700;letter-spacing:.04em;text-align:center;font-size:.92rem;padding:0 5px 15px;border-bottom:1px solid rgba(226,189,107,.35);margin-bottom:10px}.brand-logo{display:block;text-decoration:none;cursor:pointer}.brand-logo img{display:block;width:100%;max-width:164px;height:auto;margin:0 auto 10px;transition:opacity .18s ease,transform .18s ease}.brand-logo:hover img{opacity:.9;transform:scale(1.02)}.brand small{display:block;font-family:'Noto Serif Thai',serif;color:var(--muted);font-weight:400;font-size:.58rem;letter-spacing:.08em;margin-top:3px}
    nav{display:flex;flex-direction:column;gap:2px}.nav-link{width:100%;border:0;border-left:3px solid transparent;background:transparent;color:#dfcda8;text-align:left;padding:8px 9px;font:500 .78rem 'Noto Serif Thai',serif;cursor:pointer;border-radius:0 5px 5px 0;transition:.18s}.nav-link:hover,.nav-link.active{background:rgba(201,163,92,.16);border-left-color:var(--gold);color:#fff}.nav-group-head{display:flex;align-items:center}.nav-group-head .nav-link{flex:1}.nav-toggle{width:30px;border:0;background:transparent;color:var(--gold);cursor:pointer;font-size:.85rem;padding:7px 3px;transition:transform .2s}.nav-group.collapsed .nav-toggle{transform:rotate(-90deg)}.nav-toggle:focus-visible{outline:1px solid var(--gold);outline-offset:-2px}.sub-pages{overflow:hidden;max-height:160px;transition:max-height .22s ease}.nav-group.collapsed .sub-pages{max-height:0}.sub{font-size:.72rem;padding-left:21px;color:#c7ad7b}.group{font:600 .7rem Cinzel,'Noto Serif Thai',serif;color:var(--muted);letter-spacing:.08em;padding:15px 12px 3px}
    main{height:100%;min-width:0;min-height:0;position:relative;background:#111;display:flex;flex-direction:column;overflow:hidden}.menu{display:none;position:absolute;top:12px;left:12px;z-index:20;background:none;border:1px solid var(--edge);color:var(--gold);font-size:1.25rem;border-radius:4px;padding:3px 9px;cursor:pointer}.content{height:auto;flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#16100a;padding-bottom:72px}.page-frame.page-frame{width:100%;height:100%;min-height:0;border:0;display:block;background:#16100a}.sponsor-bar{position:absolute;left:0;right:0;bottom:0;z-index:30;height:54px;min-height:54px;padding:4px 10px;background:linear-gradient(180deg,rgba(29,20,12,.96),rgba(15,10,6,.99));border-top:1px solid var(--edge);box-shadow:0 -6px 18px rgba(0,0,0,.38);backdrop-filter:blur(8px)}.sponsor-inner{width:100%;height:46px;display:flex;align-items:center;gap:10px}.sponsor-heading{display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold);font:700 .58rem Cinzel,'Noto Serif Thai',serif;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase}.sponsor-list{flex:1 1 auto;width:auto;display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:thin}.sponsor-card{width:80px;height:46px;display:flex;align-items:center;justify-content:center;padding:2px;background:rgba(255,255,255,.025);border:1px solid rgba(138,101,32,.55);border-radius:4px;text-decoration:none;transition:.18s;flex:0 0 auto}.sponsor-card:hover{border-color:var(--gold);background:rgba(226,189,107,.08);transform:translateY(-2px)}.sponsor-card img{width:auto;max-width:70px;height:auto;max-height:38px;display:block;object-fit:contain;border:0;background:transparent}.sponsor-empty{display:none}.sponsor-copy,.sponsor-btn{display:none}.gift-page{min-height:100%;height:auto;padding:24px 18px 42px;background:radial-gradient(900px 460px at 10% 0,#3a2715 0,transparent 65%),#171009}.gift-head{max-width:760px;margin:0 auto 26px;text-align:center}.gift-head h1{font:700 1.45rem Cinzel,'Noto Serif Thai',serif;color:var(--gold);letter-spacing:.08em;margin:0 0 5px}.gift-head small{color:var(--muted);font:.58rem Cinzel,sans-serif;letter-spacing:.18em}.gift-info{max-width:680px;margin:15px auto 0;padding:16px 20px;background:linear-gradient(180deg,#ead9ad,#d9c394);color:#392919;border:3px double #8a6732;border-radius:4px;text-align:left;font-size:.77rem;line-height:1.7;box-shadow:0 8px 25px #0006}.gift-info h2{margin:0 0 6px;font-size:.9rem;color:#742a22}.gift-info p{margin:0}.gift-discord{display:inline-block;margin-top:12px;padding:7px 13px;background:#5865f2;color:#fff;text-decoration:none;border-radius:5px;font-size:.72rem;font-weight:700}.ticket-title{font-family:Cinzel,'Noto Serif Thai',serif;color:var(--gold);text-align:center;font-size:.9rem;letter-spacing:.08em;margin:0 0 13px}.gifts{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.gift-card{overflow:hidden;background:linear-gradient(180deg,#2a1d11,#17110b);border:1px solid #745329;box-shadow:0 7px 18px #0007;border-radius:5px;color:#ead9b5;transition:transform .18s,border-color .18s}.gift-card:hover{transform:translateY(-4px);border-color:var(--gold)}.gift-card.coming{filter:saturate(.3);opacity:.78}.gift-image{height:138px;padding:7px;background:#100c08;border-bottom:1px solid #745329}.gift-image img{width:100%;height:100%;object-fit:cover;display:block}.gift-body{padding:11px 12px 12px}.gift-status{display:inline-block;color:#d7bb78;font:600 .52rem Cinzel,sans-serif;letter-spacing:.08em}.gift-name{margin:7px 0 3px;color:#e5bf6e;font:700 .83rem Cinzel,'Noto Serif Thai',serif}.gift-price{font:700 .78rem monospace;color:#f2dfaf}.gift-actions{display:flex;gap:7px;margin-top:10px}.gift-actions a,.gift-actions span{flex:1;text-align:center;padding:6px 4px;border:1px solid #836033;color:#e6cf99;text-decoration:none;font-size:.61rem}.gift-actions a{background:#6b4a26;color:#fff}.gift-card.coming .gift-actions a{pointer-events:none;background:#3a3026;color:#b4aa9a}
    .tk-grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .tk-gem{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d24b4b,#7a1f1f 65%,#2e0d0d 100%);border:1px solid #b8892b;box-shadow:0 0 5px rgba(210,75,75,.55);z-index:3}
    .tk-gem.tl{top:-5px;left:-5px}.tk-gem.tr{top:-5px;right:-5px}.tk-gem.bl{bottom:-5px;left:-5px}.tk-gem.br{bottom:-5px;right:-5px}
    .tk-card{position:relative;background:linear-gradient(180deg,#2b2015,#1c140d);border:1px solid #8a6520;border-radius:4px;box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .2s ease,box-shadow .2s ease,filter .25s ease}
    .tk-card:hover{transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,.6),0 0 0 1px rgba(184,137,43,.3),0 0 18px rgba(224,190,111,.25);border-color:#e0be6f}
    .tk-card.coming{filter:grayscale(.92) contrast(.88) brightness(.8)}
    .tk-card.coming:hover{transform:translateY(-3px);filter:grayscale(.8) contrast(.92) brightness(.88);box-shadow:0 12px 26px rgba(0,0,0,.5);border-color:#8a6520}
    .tk-card.coming .tk-gem{background:radial-gradient(circle at 35% 30%,#cfcfcf,#6b6b6b 65%,#1c1c1c 100%);border-color:#8a8a8a;box-shadow:0 0 5px rgba(120,120,120,.4)}
    .tk-media{position:relative;width:100%;aspect-ratio:4/3;background:#1c140d;overflow:hidden;border-bottom:1px solid #8a6520;padding:8px}
    .tk-media-inner{position:relative;width:100%;height:100%;border:1px solid #8a6520;overflow:hidden}
    .tk-media img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.03)}
    .tk-card.coming .tk-media img{filter:saturate(0) contrast(1) brightness(.95)}
    .tk-status{position:absolute;top:12px;left:12px;z-index:2;font-family:Cinzel,'Noto Serif Thai',serif;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.4)}
    .tk-tear{position:relative;height:0;border-top:1px dashed #8a6520;margin:0 18px}
    .tk-tear::before,.tk-tear::after{content:"";position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:#14100c;box-shadow:0 0 0 1px #8a6520 inset}
    .tk-tear::before{left:-25px}.tk-tear::after{right:-25px}
    .tk-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;position:relative}
    .tk-team-row{display:flex;align-items:center;gap:9px}
    .tk-badge{width:24px;height:24px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#e0be6f,#8a6520 70%);color:#241a0f;border:2px solid #b8892b;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:11px;font-weight:700;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
    .tk-team{font-family:Cinzel,'Noto Serif Thai',serif;font-size:9.5px;color:#c2ac82;text-transform:uppercase;letter-spacing:1.3px}
    .tk-title{font-family:Cinzel,'Noto Serif Thai',serif;font-size:17px;font-weight:700;text-transform:uppercase;margin:2px 0 4px;color:#e0be6f;text-shadow:0 2px 0 rgba(0,0,0,.4)}
    .tk-price{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;color:#e0be6f}
    .tk-price .cur{color:#c2ac82;font-size:12px;margin-right:2px}
    .tk-actions{display:flex;gap:8px;margin-top:12px}
    .tk-buy{position:relative;flex:1.3;display:flex;align-items:center;justify-content:center;gap:5px;height:34px;background:linear-gradient(180deg,#6b4a26,#452c16 55%,#38220f);border:1px solid #8a6520;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);color:#f0e4c6;font-family:Cinzel,serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:filter .15s ease;text-decoration:none}
    .tk-buy:hover{filter:brightness(1.25)}
    .tk-card.coming .tk-buy{filter:grayscale(1);opacity:.45;pointer-events:none}
    .tk-outline{flex:1;background:transparent;color:#c2ac82;border:1px solid #8a6520;border-radius:4px;font-family:'Noto Serif Thai',serif;font-weight:600;font-size:11px;padding:0 8px;cursor:pointer;transition:background .15s ease,color .15s ease}
    .tk-outline:hover{background:rgba(184,137,43,.12);color:#e0be6f}
    .tk-overlay{position:fixed;inset:0;background:rgba(10,8,5,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
    .tk-overlay.open{display:flex}
    .tk-modal-frame{position:relative;width:100%;max-width:380px;background:linear-gradient(180deg,#2b2015,#1c140d);border:1px solid #8a6520;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
    .tk-modal{position:relative;border:1px solid #8a6520;padding:22px;max-height:80vh;overflow:auto}
    .tk-modal-eyebrow{font-family:Cinzel,serif;font-size:10px;letter-spacing:1.5px;color:#c2ac82;text-transform:uppercase}
    .tk-modal h2{font-family:Cinzel,'Noto Serif Thai',serif;text-transform:uppercase;margin:8px 0 12px;font-size:19px;color:#e0be6f}
    .tk-modal .tk-price{display:block;margin:6px 0 16px}
    .tk-modal p.tk-desc{color:#c2ac82;font-size:12.5px;line-height:1.75;margin:0 0 18px}
    .tk-modal .tk-outline{width:100%;height:36px}
    @media(max-width:760px){body{overflow:hidden}.app{display:block;height:100dvh}.content{padding-bottom:60px}.sponsor-bar{min-height:50px;height:50px;padding:3px 6px}.sponsor-inner{height:44px;gap:7px}.sponsor-heading{font-size:.5rem;letter-spacing:.07em}.sponsor-list{gap:6px;justify-content:flex-start}.sponsor-card{width:72px;height:42px}.sponsor-card img{max-width:64px;max-height:36px}.menu{display:block}aside{position:fixed;z-index:5;left:0;top:0;bottom:0;width:210px;transform:translateX(-102%);transition:transform .2s;box-shadow:10px 0 30px #000}body.menu-open aside{transform:translateX(0)}main{height:100dvh;min-height:0}.content{height:auto;flex:1 1 auto;min-height:0;overflow-y:auto}.gift-page{padding:17px 12px}.gifts{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.gift-image{height:125px}.tk-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}@media(max-width:430px){.gifts{grid-template-columns:1fr;max-width:280px}.tk-grid{grid-template-columns:1fr;max-width:320px}}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"><div class="brand"><a href="#home" class="brand-logo" aria-label="กลับหน้าหลัก"><img src="logo.png" alt="Medieval RP"></a><small>ROLEPLAY THAILAND</small></div><nav id="navigation"></nav></aside>
    <main><div class="content" id="content"></div><div class="sponsor-bar" id="sponsorBar" aria-label="ผู้สนับสนุน"><div class="sponsor-inner"><div class="sponsor-heading">SPONSOR By</div><div class="sponsor-list" id="sponsorList"></div></div></div><button class="menu" id="menu" aria-label="เปิดเมนู">☰</button></main>
  </div>
  <script>
    /*
 * ================================
 * MENU / PAGE SETTINGS
 * ================================
 * enabled: true  = แสดงเมนูและเปิดหน้าได้
 * enabled: false = ซ่อนเมนูและไม่อนุญาตให้เปิดหน้านั้น
 *
 * ในอนาคตเพิ่ม EP ใหม่ได้โดยเพิ่มรายการ เช่น:
 * {id:'ep4', label:'เนื้อเรื่อง EP.4', file:'EP4.html', enabled:false}
 */
const pages=[
  {id:'home',label:'HOME',file:'HOME.html',enabled:true},
  {id:'about',label:'ABOUT',file:'ABOUT.html',enabled:true},
  {id:'rules',label:'RULES',file:'RULES.html',enabled:true},
  {id:'lore',label:'SERVER LORE',file:'SERVER LORE.html',enabled:true},

  {id:'ep1',label:'เนื้อเรื่อง EP.1',file:'EP1.html',enabled:true},
  {id:'ep2',label:'เนื้อเรื่อง EP.2',file:'EP2.html',enabled:false},
  {id:'ep3',label:'เนื้อเรื่อง EP.3',file:'EP3.html',enabled:false},
  {id:'ep4',label:'เนื้อเรื่อง EP.4',file:'EP4.html',enabled:false},

  {id:'guide',label:'GUIDE',file:'GUIDE.html',enabled:true},
  {id:'legend',label:'เรื่องเล่า ตำนาน',file:'เรื่องเล่า ตำนาน.html',enabled:true},
  {id:'roles',label:'บทบาท',file:'บทบาท.html',enabled:true},

  {id:'whitelist',label:'Whitelist Registration',file:'Whitelist Registration.html',enabled:false},
  {id:'gifting',label:'GIFTING',file:'GIFTING.html',enabled:true}
];

const nav=document.getElementById('navigation');
const content=document.getElementById('content');

// ค้นหาหน้าจาก ID
const getPage=(id)=>pages.find(p=>p.id===id);

// สร้างปุ่มเมนูเฉพาะหน้าที่ enabled
const makeLink=(page)=>{
  if(!page || !page.enabled) return null;
  const b=document.createElement('button');
  b.className='nav-link';
  b.dataset.id=page.id;
  b.textContent=page.label;
  b.onclick=()=>location.hash=page.id;
  return b;
};

// กำหนดโครงสร้างเมนู
const menuStructure=[
  {id:'home'},
  {id:'about'},
  {id:'rules'},
  {id:'lore',children:['ep1','ep2','ep3','ep4']},
  {id:'guide',children:['legend','roles']},
  {id:'whitelist'},
  {id:'gifting'}
];

// สร้างเมนูจากการตั้งค่า enabled
menuStructure.forEach(item=>{
  const parent=getPage(item.id);
  if(!parent || !parent.enabled) return;

  if(!item.children){
    const link=makeLink(parent);
    if(link) nav.append(link);
    return;
  }

  const enabledChildren=item.children
    .map(getPage)
    .filter(page=>page && page.enabled);

  // ถ้าไม่มีหน้าย่อยที่เปิดอยู่ จะไม่สร้างกลุ่ม
  if(enabledChildren.length===0) return;

  const group=document.createElement('div');
  group.className='nav-group collapsed';

  const head=document.createElement('div');
  head.className='nav-group-head';

  const parentLink=makeLink(parent);
  if(parentLink) head.append(parentLink);

  const toggle=document.createElement('button');
  toggle.className='nav-toggle';
  toggle.textContent='⌄';
  toggle.setAttribute('aria-label','เปิด/ปิดหน้าย่อย');
  toggle.onclick=(e)=>{
    e.preventDefault();
    e.stopPropagation();
    group.classList.toggle('collapsed');
  };
  head.append(toggle);

  const sub=document.createElement('div');
  sub.className='sub-pages';

  enabledChildren.forEach(page=>{
    const link=makeLink(page);
    if(link){
      link.classList.add('sub');
      sub.append(link);
    }
  });

  group.append(head,sub);
  nav.append(group);
});

// ================================
// SUPPORTER / SPONSOR BAR
// ================================
// เพิ่มผู้สนับสนุนได้จากรายการนี้
// ใช้เฉพาะรูป + URL เท่านั้น
// image = ชื่อไฟล์รูป หรือ URL ของรูป
// url = เว็บไซต์ที่จะเปิดเมื่อคลิกรูป
const sponsors = [
  {image:'sponsor1.png', url:'https://www.facebook.com/kaigroomingofficial/'}
];

const sponsorList=document.getElementById('sponsorList');
function renderSponsors(){
  if(!sponsorList) return;
  sponsorList.replaceChildren();

  if(!sponsors.length){
    const empty=document.createElement('div');
    empty.className='sponsor-empty';
    sponsorList.append(empty);
    return;
  }

  sponsors.forEach((sponsor)=>{
    if(!sponsor.image) return;

    const card=document.createElement('a');
    card.className='sponsor-card';
    card.href=sponsor.url || '#';
    card.target='_blank';
    card.rel='noopener noreferrer';
    card.setAttribute('aria-label','เปิดเว็บไซต์ผู้สนับสนุน');

    const img=document.createElement('img');
    img.src=sponsor.image;
    img.alt='Sponsor';
    img.loading='lazy';
    img.onerror=()=>card.remove();
    card.append(img);
    sponsorList.append(card);
  });
}
renderSponsors();

// โหลดทุกหน้าจากไฟล์ HTML ต้นทางของหน้านั้นเอง
function loadPage(item){
  const frame=document.createElement('iframe');
  frame.className='page-frame';
  frame.title=item.label;
  frame.src=item.file;
  frame.loading='eager';
  frame.setAttribute('scrolling','auto');

  frame.addEventListener('load',()=>{
    // คงพฤติกรรมการย่อหน้าภายใน iframe แบบเดิม
    try{
      frame.contentDocument.documentElement.style.zoom='.86';
    }catch(e){
      // ถ้า iframe ถูกบล็อกการเข้าถึง DOM ให้แสดงตามขนาดปกติ
    }
  });

  content.replaceChildren(frame);
}

function render(){
  const requestedId=location.hash.slice(1)||'home';
  let item=getPage(requestedId);

  // ถ้าหน้านั้นถูกปิด หรือไม่มีอยู่จริง ให้กลับ HOME
  if(!item || !item.enabled){
    item=getPage('home');
    if(location.hash !== '#home') history.replaceState(null,'','#home');
  }

  document.querySelectorAll('.nav-link').forEach(x=>{
    x.classList.toggle('active',x.dataset.id===item.id);
  });

  document.body.classList.remove('menu-open');

  document.querySelectorAll('.nav-group').forEach(g=>{
    const activeLink=g.querySelector(`[data-id="${item.id}"]`);
    const headLink=g.querySelector('.nav-group-head .nav-link');

    if(activeLink && headLink && item.id!==headLink.dataset.id){
      g.classList.remove('collapsed');
    }
  });

  // ไม่มีข้อมูลเนื้อหาซ้ำใน index.html อีกต่อไป
  // ทุกหน้าจะถูกโหลดจากไฟล์ .html ต้นทางของตัวเอง
  loadPage(item);
}

window.addEventListener('hashchange',render);
document.getElementById('menu').onclick=()=>document.body.classList.toggle('menu-open');
render();
</script>
</body>
</html>
